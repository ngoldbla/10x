name: Nine
options:
  bundleIdPrefix: com.couchsuite
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
    macOS: "15.0"
packages:
  CouchKit:
    path: ../couchkit
targets:
  Nine:
    type: application
    # One universal target: the tvOS app, the iOS (iPhone/iPad) app and the
    # native macOS app build from the same sources — RootView picks the
    # remote, touch or keyboard UI per platform, and per-SDK settings below
    # pick icons, entitlements and signing profiles (PRD-4 §1).
    supportedDestinations: [tvOS, iOS, macOS]
    sources:
      - Sources/App
      - Sources/Engine
      - Sources/Shared
      # The String Catalog and its accessor (PRD-20). Listed by BOTH targets on
      # purpose: NineWidgets compiles Sources/Shared and Sources/Engine in, so it
      # needs the same keys resolved against its OWN bundle — in an app extension
      # `Bundle.main` IS the extension. A catalog in only the app gives the
      # widget an English Home Screen on a localized phone, and three green
      # platform builds do not catch it. `CatalogTests` counts the two entries
      # here; `find … -name '*.lproj'` on both built bundles is what settles it,
      # for the reason PRD-16's alternate icons gave: that shipped green with no
      # `CFBundleAlternateIcons` at all, and only the artifact disagreed.
      #
      # Deliberately not a SwiftPM target: `LocalizedStringResource` does not
      # exist on Linux and Package.swift must stay Linux-clean.
      - Sources/Strings
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CouchKit
      # The widget family ships on iOS only; embedding into the tvOS app
      # would break tvOS signing (PRD-3 §5).
      - target: NineWidgets
        embed: true
        destinationFilters: [iOS]
      # The watch app (PRD-6) rides inside the iOS app, exactly as the widget
      # does and for the same signing reason: it must never enter the tvOS or
      # macOS dependency graph. `xcodebuild -destination generic/platform=tvOS`
      # is the check that this filter is doing its job.
      - target: NineWatch
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsuite.nine
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2,3"
        # tvOS keeps the layered brand asset; iOS uses the flat square icon;
        # macOS uses its own margined, rounded icon set (PRD-4 §1).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": "AppIcon-macOS"
        # PRD-16 alternate icons, iOS SDKs only: a tvOS icon is a layered brand
        # asset and macOS has no `setAlternateIconName`, so naming these there
        # would hand actool iOS icon sets to validate against the wrong idiom.
        # Together these two settings are the whole mechanism — they make actool
        # emit the `CFBundleAlternateIcons` dictionary into Info.plist. There is
        # no entitlement and no App ID capability behind alternate icons, so no
        # `match` re-mint is implied; the PR carries the artifact that proves it.
        #
        # BOTH keys are required, and the failure mode is silent. With only
        # ALTERNATE_APP_ICON_NAMES set, actool ignores it without a warning: the
        # build succeeds, the icon sets are in the catalog, and Info.plist simply
        # has no CFBundleAlternateIcons — so setAlternateIconName fails at
        # runtime on a device and nowhere else. INCLUDE_ALL_APPICON_ASSETS is
        # what makes actool compile the non-primary sets in the first place.
        "ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphoneos*]": true
        "ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphonesimulator*]": true
        "ASSETCATALOG_COMPILER_ALTERNATE_APP_ICON_NAMES[sdk=iphoneos*]":
          - AppIcon-Ember
          - AppIcon-Tide
          - AppIcon-Mono
        "ASSETCATALOG_COMPILER_ALTERNATE_APP_ICON_NAMES[sdk=iphonesimulator*]":
          - AppIcon-Ember
          - AppIcon-Tide
          - AppIcon-Mono
        "ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME[sdk=appletvos*]": "Launch Image"
        "ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME[sdk=appletvsimulator*]": "Launch Image"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: ${COUCH_TEAM_ID}
        # App Sandbox is mandatory for the Mac App Store; hardened runtime
        # rides with it. tvOS/iOS are unaffected (this key is macOS-scoped by
        # the entitlements override below, not here).
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        # match names tvOS profiles with a "tvos" suffix, macOS with "macos";
        # iOS gets the default.
        "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "match AppStore com.couchsuite.nine tvos"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "match AppStore com.couchsuite.nine"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "match AppStore com.couchsuite.nine macos"
        # iOS adds the app group (widget snapshot) + CloudKit; macOS gets its
        # own sandbox + KVS + game-center + CloudKit; tvOS gets game-center +
        # KVS + CloudKit (PRD-8 §5: tvOS now has its own entitlements file
        # instead of the generated default, to carry the CloudKit container).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Nine-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Nine-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Nine-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]": Nine-tvOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvsimulator*]": Nine-tvOS.entitlements
    entitlements:
      path: Nine.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Leaderboards + achievements (Game Center is default-enabled on App
        # IDs, so existing match profiles already carry this entitlement).
        com.apple.developer.game-center: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # English is the source language, so it is the development region.
        #
        # `CFBundleLocalizations` is declared rather than inferred because
        # xcodegen writes the Info.plist itself and the app has no per-language
        # `.lproj` resources of its own — everything is in one String Catalog,
        # which the build compiles into `<lang>.lproj/Localizable.strings`
        # inside the bundle. Without this list a locale that the catalog
        # carries but the bundle does not advertise is simply never chosen, and
        # the app falls back to English with no error anywhere.
        #
        # **All ten, because the catalog now carries all ten** (Task 9). This
        # list was `[en]` until the translations existed, and the reason is
        # worth keeping: `CFBundleLocalizations` is authoritative when present,
        # merging to main triggers `beta_all`, and a build declaring `ja` with
        # no Japanese in it gives a Japanese TestFlight tester Japanese system
        # UI and Japanese month names — `ArchiveCalendar`'s formatter follows
        # `Locale.current` on purpose — wrapped around English prose. App Store
        # Connect would also read ten locales off the build and list the app as
        # localized into ten languages on the strength of the plist alone.
        #
        # It moved in the same commit as the translations, and
        # `CatalogTests.testDeclaredLocalizationsMatchTranslatedLocales` is what
        # made that atomic: it derives the expected set and fails in BOTH
        # directions — a declared locale with no translations, or a translated
        # locale nobody declared. "Remember to flip it later" is not a mechanism.
        #
        # Order here is preference order, not a set: English first, then the
        # nine in PRD-20's launch order. The test compares sorted, so this
        # ordering is free.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, de, fr, es, it, pt-BR, ko, zh-Hans, nl]
        ITSAppUsesNonExemptEncryption: false
        # Required for the Mac App Store (.pkg upload rejects without it, error
        # 90242); harmless/valid on iOS too, ignored by tvOS. Nine is a sudoku.
        LSApplicationCategoryType: public.app-category.puzzle-games
        # PRD-5: an extended gamepad drives the Pad Play session. Declare
        # controller-driven UI support and the ExtendedGamepad profile — but
        # NOT a requires-controller key: the app stays fully remote-playable, so
        # enforcement is session-scoped, never app-wide.
        GCSupportsControllerUserInteraction: true
        # Each entry must be a dict keyed `ProfileName` — any other shape fails
        # App Store validation (error 90593, seen on the first post-merge
        # upload). MicroGamepad = the Siri Remote grammar RemoteKit speaks.
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        # Widgets deep-link into today's daily via nine://daily.
        CFBundleURLTypes:
          - CFBundleURLName: com.couchsuite.nine
            CFBundleURLSchemes: [nine]
        # iOS-only keys (ignored by tvOS): no storyboard — an empty modern
        # launch screen inherits the window background. Appearance follows
        # the system (or the in-app Appearance pref) since 1.1.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # The Home Screen / Lock Screen widget family (PRD-3). iOS only — never in
  # the tvOS dependency graph. Phase 3b compiles the Engine in (real
  # `place()` runs in-process; the CouchKit package is linked for CouchCore)
  # but the widget never runs the generator — extension budget is ~30MB.
  NineWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "18.0"
    sources:
      # xcodegen classifies the .xcprivacy inside Sources/Widgets as a
      # resource automatically.
      - Sources/Widgets
      - Sources/Shared
      - Sources/Engine
      # The same catalog and accessor as the app target, compiled a second time
      # into this bundle — see the long comment on `Nine.sources`. `Bundle.main`
      # here is the .appex, so this is the only copy the widget can read.
      - Sources/Strings
    dependencies:
      - package: CouchKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsuite.nine.widgets
        # ASC requires the extension's CFBundleShortVersionString to equal
        # the app's; CURRENT_PROJECT_VERSION stays in lockstep via the
        # project-wide xcargs the Fastfile passes.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: ${COUCH_TEAM_ID}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "match AppStore com.couchsuite.nine.widgets"
    entitlements:
      path: NineWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.couchsuite.nine
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Nine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The same locales as the app, declared here too because this is a
        # separate bundle with a separate Info.plist: an extension resolves
        # against its own `Bundle.main`, so "the app declares it" is not a fact
        # about the widget. Same argument as listing Sources/Strings twice, and
        # the same ruling on the contents — it moved off `[en]` in the same
        # commit as the app's, because the widget renders the same catalog and a
        # widget declaring fewer locales than the app it ships inside is an
        # English Home Screen on a Japanese phone with everything else translated.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, de, fr, es, it, pt-BR, ko, zh-Hans, nl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Nine on the wrist (PRD-6). A modern single-target watchOS app: no companion
  # WatchKit extension, no `WKCompanionAppBundleIdentifier` — embedding it in
  # the iOS app is the whole association. iOS-only in the graph, like the
  # widget, and for the same reason.
  NineWatch:
    type: application
    # `platform:` rather than `supportedDestinations:` — xcodegen refuses a
    # multiplatform app that names watchOS ("Create a separate target using
    # 'platform' for watchOS apps"), which is also what PRD-6 §4 Step 1 wrote.
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - Sources/Watch
      - Sources/Engine
      - Sources/Shared
      # A third bundle is a third `Bundle.main`, so the catalog is compiled in
      # a third time — the same argument the widget's copy carries, and the
      # same one `CatalogTests.testEveryTargetListsTheStringsTree` enforces.
      - Sources/Strings
      # Named files rather than `Sources/App`: the board is reused (PRD-6 §4
      # Step 2 — "one drawing surface, two camera positions"), the phone UI is
      # not. `Theme.swift` exists so this list can stop before `AppModel.swift`;
      # `Afterglow.metal` is deliberately absent, because watchOS has no
      # SwiftUI shaders and `BoardView` gates them out here.
      - Sources/App/BoardView.swift
      - Sources/App/BoardAccessibility.swift
      - Sources/App/Theme.swift
      - Assets.xcassets
    dependencies:
      - package: CouchKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsuite.nine.watchkitapp
        # ASC requires an embedded watch app's CFBundleShortVersionString to
        # equal its host's; CURRENT_PROJECT_VERSION rides the project-wide
        # xcargs the Fastfile passes, so the build number follows the iOS train.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-watchOS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: ${COUCH_TEAM_ID}
        # A watchOS App Store profile is minted under the iOS platform in the
        # portal, so match names it without a suffix — the widget's convention.
        "PROVISIONING_PROFILE_SPECIFIER[sdk=watchos*]": "match AppStore com.couchsuite.nine.watchkitapp"
        "CODE_SIGN_ENTITLEMENTS[sdk=watchos*]": NineWatch.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=watchsimulator*]": NineWatch.entitlements
    info:
      path: WatchInfo.plist
      properties:
        CFBundleDisplayName: Nine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, de, fr, es, it, pt-BR, ko, zh-Hans, nl]
        # The modern single-target marker. Without it the bundle is treated as
        # a legacy WatchKit app and refuses to launch.
        WKApplication: true
        # The watch app runs with the phone out of range — the whole point of
        # the Gentle fallback (PRD-6 §2.4, and D6 of the plan).
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
